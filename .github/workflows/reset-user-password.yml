name: Reset user password on VPS

on:
  workflow_dispatch:
    inputs:
      username:
        description: Username to update
        required: true
        default: eya
      password:
        description: New password
        required: true

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Check VPS1 credentials
        id: config
        env:
          VPS_HOST: ${{ secrets.VPS1_HOST }}
          VPS_USER: ${{ secrets.VPS1_USER }}
          VPS_KEY: ${{ secrets.VPS1_SSH_KEY }}
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] && [ -n "$VPS_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Reset password on Hostinger
        if: steps.config.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS1_HOST }}
          username: ${{ secrets.VPS1_USER }}
          key: ${{ secrets.VPS1_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/usersniper
            USERNAME="${{ github.event.inputs.username }}"
            PASSWORD="${{ github.event.inputs.password }}"
            docker compose -f infra/docker/docker-compose.control.yml exec -T api \
              python -m scripts.set_password "$USERNAME" "$PASSWORD"
