services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Vultr sniper nodes connect here — firewall to VPS2 IP only.
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: ../../apps/api
      dockerfile: ../../infra/docker/api.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - API_MODE=control
      - SNIPER_DISTRIBUTED=true
    depends_on:
      - redis
    volumes:
      - user_data:/var/lib/usersniper/data
    expose:
      - "8000"

  # Discord only — Hostinger dedicated nodes. Scale: --scale sniper-node=8
  sniper-node:
    build:
      context: ../../apps/api
      dockerfile: ../../infra/docker/api.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - API_MODE=sniper
      - SNIPER_VPS_POOL=vps1
      - SNIPER_DISTRIBUTED=true
      - SNIPER_NODE_MAX_JOBS=1
    depends_on:
      - redis
    volumes:
      - user_data:/var/lib/usersniper/data

  # Social + gaming platforms — Hostinger. Scale: --scale sniper-social=6
  sniper-social:
    build:
      context: ../../apps/api
      dockerfile: ../../infra/docker/api.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - API_MODE=sniper
      - SNIPER_VPS_POOL=vps3
      - SNIPER_DISTRIBUTED=true
      - SNIPER_NODE_MAX_JOBS=1
    depends_on:
      - redis
    volumes:
      - user_data:/var/lib/usersniper/data

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ../nginx/api.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  redis_data:
  user_data:
